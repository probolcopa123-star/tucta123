```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi página con Iframes</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #800020;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .contenedor {
            width: 90%;
            margin: 30px auto;
            display: flex;
            gap: 20px;
        }

        iframe {
            width: 50%;
            height: 800px;
            border: 3px solid #800020;
            border-radius: 8px;
            background-color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>COLEGIO PROVINCIA DE BOLÍVAR</h1>
        <p>Página informativa</p>
    </header>

    <main class="contenedor">

        <iframe 
            src="página3roAinf.html"
            title="Primer iframe">
        </iframe>

        <iframe 
            src="pagina web del cole.html"
            title="Segundo iframe">
        </iframe>

    </main>

</body>
</html>
